ignoreUntil = 2027-01-31
reason = "glob 13.0.6 (fixed only in glob 14, a new major): used by @expo/cli and build tooling on the repository's own files; not in the app bundle or any server. Revisit with the next Expo SDK."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch 3.1.5, 5.1.9, 9.0.9 and 10.2.6 (fixed only in minimatch 11, a new major): used by ESLint, typescript-eslint, Jest, glob and Expo tooling with the repository's own patterns; not in the app bundle or any server."

