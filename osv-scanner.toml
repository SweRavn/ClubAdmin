# OSV-Scanner exceptions (Security workflow). Each entry: a known
# vulnerability without a usable fix, why it does not affect ClubAdmin, and
# a date by which it is looked at again. Tracked in
# https://github.com/SweRavn/ClubAdmin/issues/13.

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2027-01-31
reason = "node-forge (no fixed version; 1.4.1 pinned through pnpm overrides): used by @expo/cli for the development server's certificates only; not in the app bundle or any server."

[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2027-01-31
reason = "decode-uri-component 0.2.2: the fixed 0.5.0 is ESM-only and breaks query-string 7, which expo-router requires; it only decodes the app's own deep links (clubadmin://...). Revisit with the next Expo SDK."

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-31
reason = "zod 3.25.76 (fixed only in zod 4): a dependency of @expo/cli, the developer command line, alone; not in the app bundle, the API or the web app, which use zod 4.6.7. Revisit with the next Expo SDK."

