# Development overrides: ports published on 127.0.0.1 only, the dev Caddyfile
# (local CA, routes to apps running on the host) and Mailpit for email.

services:
  postgres:
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432

  valkey:
    ports:
      - 127.0.0.1:${VALKEY_PORT:-6379}:6379

  garage:
    ports:
      - 127.0.0.1:${S3_PORT:-3900}:3900 # S3 API
      - 127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903 # admin API (used by pnpm dev to create buckets)

  caddy:
    ports:
      - 127.0.0.1:${CADDY_HTTP_PORT:-80}:80
      - 127.0.0.1:${CADDY_HTTPS_PORT:-443}:443
    environment:
      WEB_UPSTREAM: ${WEB_UPSTREAM:-host.docker.internal:3000}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:4000}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      backend:
        # pgBackRest only speaks HTTPS to S3: the backup containers reach Garage
        # through Caddy under this name (BACKUP_S3_ENDPOINT).
        aliases:
          - s3.${APP_DOMAIN:-clubadmin.localhost}
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./caddy/placeholder.html:/srv/placeholder/index.html:ro

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "5000"
    ports:
      - 127.0.0.1:${SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backend]
