# Seats from My schedule (P2.7c, P2.7d): Alva has answered "Kommer"; Sara
# picks Mikael's car once and Alva has a seat there and home; the seats show
# under the answer at once.
appId: ${APP_ID}
name: Ride there and home from My schedule
---
- runFlow:
    file: subflows/login-as.yaml
    env:
      PERSONA: 0199a000-0000-7000-8000-000000000007
- back
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 20000
- scrollUntilVisible:
    element: "Åk med: Mikael Lindqvist.*dit och hem.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Åk med: Mikael Lindqvist.*dit och hem.*"
- extendedWaitUntil:
    visible: "Åker dit med Mikael Lindqvist.*"
    timeout: 20000
# The booked rows replace the button at the bottom edge: the way home may be
# just below it.
- scrollUntilVisible:
    element: "Åker hem med Mikael Lindqvist.*"
    direction: DOWN
    timeout: 10000
