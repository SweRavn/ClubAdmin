# Real login with Zitadel: PKCE in a Custom Tab with the e2e user.
# env: EMAIL, PASSWORD (created by the CI job through Zitadel's API)
appId: ${APP_ID}
name: Log in with Zitadel
---
- launchApp:
    clearState: true
    clearKeychain: true
# Starting again after clearing the state can be slow on the CI emulator.
- extendedWaitUntil:
    visible:
      id: "login-zitadel"
    timeout: 90000
- tapOn:
    id: "login-zitadel"
# Chrome's first-run screens on a fresh emulator (Custom Tab).
- extendedWaitUntil:
    visible: "(?i).*(login ?name|e-?post|användarnamn|e-?mail|use without an account|accept & continue).*"
    timeout: 60000
- runFlow:
    when:
      visible: "(?i)(use without an account|accept & continue)"
    commands:
      - tapOn: "(?i)(use without an account|accept & continue)"
- runFlow:
    when:
      visible: "(?i)(no,? thanks|no thanks)"
    commands:
      - tapOn: "(?i)(no,? thanks|no thanks)"
- extendedWaitUntil:
    visible: "(?i).*(login ?name|e-?post|användarnamn|e-?mail).*"
    timeout: 60000
- tapOn: "(?i).*(login ?name|e-?post|användarnamn|e-?mail).*"
- inputText: ${EMAIL}
- tapOn: "(?i)(fortsätt|next|continue)"
- extendedWaitUntil:
    visible: "(?i).*(lösenord|password).*"
    timeout: 30000
- tapOn: "(?i).*(lösenord|password).*"
- inputText: ${PASSWORD}
- tapOn: "(?i)(fortsätt|next|continue)"
# Zitadel offers 2-factor setup after the password (skippable, see
# mfaInitSkipLifetime in infra/zitadel). Wait for that page or the app, then
# scroll to the skip button, which can be below the fold.
- extendedWaitUntil:
    visible: "(?i).*(2-factor|2-faktor|tvåfaktor).*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "(?i).*(2-factor|2-faktor|tvåfaktor).*"
    commands:
      - scrollUntilVisible:
          element: "(?i).*(använd inte 2-faktor|hoppa över|skip).*"
          direction: DOWN
          timeout: 15000
      - tapOn: "(?i).*(använd inte 2-faktor|hoppa över|skip).*"
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 60000
