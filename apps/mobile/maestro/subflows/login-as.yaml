# Logs in as a demo persona through the DEV_AUTH picker (development builds).
# env: PERSONA (the person's ID, docs/demodata)
appId: ${APP_ID}
---
# Stop the app before clearing it: `launchApp` with `clearState` alone
# sometimes restarts the app before the clearing has finished on the CI
# emulator, which then still shows the previous flow's session.
- stopApp
- clearState
- clearKeychain
- launchApp
# Still signed in after a minute (the clearing raced with the start): clear
# once more.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "login-screen"
    commands:
      - stopApp
      - clearState
      - clearKeychain
      - launchApp
# The login screen, then scroll to the persona (it appears once the picker has
# loaded the personas). Waiting for the picker itself is unreliable: it is
# taller than the screen. After clearing the app's state the emulator
# sometimes takes over 30 s to start it again (CI), hence the long wait.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "persona-${PERSONA}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "persona-${PERSONA}"
# The start screen is My schedule (P1.4); the flows go on from clubs and groups.
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 30000
- tapOn:
    id: "open-home"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
