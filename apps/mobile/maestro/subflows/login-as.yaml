# Logs in as a demo persona through the DEV_AUTH picker (development builds).
# env: PERSONA (the person's ID, docs/demodata)
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
# The login screen, then scroll to the persona (it appears once the picker has
# loaded the personas). Waiting for the picker itself is unreliable: it is
# taller than the screen. After clearing the app's state the emulator
# sometimes takes over 30 s to start it again (CI), hence the long wait.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "persona-${PERSONA}"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "persona-${PERSONA}"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
