name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, licences
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm licenses:check
      - run: pnpm licenses:check --mobile

      - name: API client is up to date with the API
        run: |
          pnpm api:client
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'pnpm api:client' and commit the result."
            exit 1
          }

  services:
    name: Local services, integration and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Start services (without ClamAV)
        run: pnpm dev:services

      - name: Smoke test
        run: pnpm dev:smoke

      - name: Integration tests (API and worker against the services)
        run: pnpm test:integration

      - name: Start the API and the web app (DEV_AUTH on, as in development)
        run: |
          echo "127.0.0.1 clubadmin.localhost auth.clubadmin.localhost api.clubadmin.localhost mail.clubadmin.localhost" | sudo tee -a /etc/hosts
          set -a; . ./.env.local; set +a
          pnpm --filter @clubadmin/api build
          (cd apps/api && nohup node --enable-source-maps --import ./dist/instrumentation.js ./dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd apps/web && NEXT_TELEMETRY_DISABLED=1 nohup pnpm exec next dev --port 3000 > "$RUNNER_TEMP/web.log" 2>&1 &)
          for url in http://127.0.0.1:4000/health/ready http://127.0.0.1:3000/auth/login; do
            timeout 120 sh -c "until curl -sf -o /dev/null $url; do sleep 2; done"
          done

      - name: Install Playwright's Chromium
        run: pnpm --filter @clubadmin/web exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright; real Zitadel login and DEV_AUTH)
        run: |
          set -a; . ./.env.local; set +a
          docker compose --project-name clubadmin cp zitadel:/zitadel/bootstrap/admin.pat "$RUNNER_TEMP/admin.pat"
          ZITADEL_PAT="$(cat "$RUNNER_TEMP/admin.pat")" pnpm --filter @clubadmin/web test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Doctor
        if: always()
        run: pnpm dev:doctor || true

      - name: Service and app logs
        if: failure()
        run: |
          docker compose --project-name clubadmin logs --no-color --tail 300
          tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" || true
