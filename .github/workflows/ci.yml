name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the breaking-change check compares with the base commit.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm licenses:check
      - run: pnpm licenses:check --mobile

      - name: API client is up to date with the API
        run: |
          pnpm api:client
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'pnpm api:client' and commit the result."
            exit 1
          }

      - name: Mobile licence list is up to date
        run: |
          pnpm --filter @clubadmin/mobile licenses:generate
          git diff --exit-code -- apps/mobile/src/licenses.json || {
            echo "::error::apps/mobile/src/licenses.json is out of date. Run 'pnpm --filter @clubadmin/mobile licenses:generate' and commit the result."
            exit 1
          }

      - name: Mobile production bundle (no development code, size budget)
        run: pnpm --filter @clubadmin/mobile bundle:check

      # ADR 0029: within /api/v1 the API only grows. oasdiff runs through Go's
      # module proxy (Go is on the runner image; GOTOOLCHAIN=auto fetches the
      # version oasdiff needs).
      - name: No breaking API changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm api:breaking "$BASE_SHA"

  services:
    name: Local services, integration and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Start services (without ClamAV)
        run: pnpm dev:services

      - name: Smoke test
        run: pnpm dev:smoke

      - name: Integration tests (API and worker against the services)
        run: pnpm test:integration

      - name: Seed scenarios (load with 10 clubs, then the demo the end-to-end tests run on)
        run: |
          pnpm db:reset --scenario load --size 10
          pnpm db:reset

      - name: Start the API and the web app (DEV_AUTH on, as in development)
        run: |
          echo "127.0.0.1 clubadmin.localhost auth.clubadmin.localhost api.clubadmin.localhost mail.clubadmin.localhost" | sudo tee -a /etc/hosts
          set -a; . ./.env.local; set +a
          pnpm --filter @clubadmin/api build
          (cd apps/api && nohup node --enable-source-maps --import ./dist/instrumentation.js ./dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd apps/web && NEXT_TELEMETRY_DISABLED=1 nohup pnpm exec next dev --port 3000 > "$RUNNER_TEMP/web.log" 2>&1 &)
          for url in http://127.0.0.1:4000/health/ready http://127.0.0.1:3000/login; do
            timeout 120 sh -c "until curl -sf -o /dev/null $url; do sleep 2; done"
          done

      - name: Install Playwright's Chromium
        run: pnpm --filter @clubadmin/web exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright; real Zitadel login and DEV_AUTH)
        run: |
          set -a; . ./.env.local; set +a
          docker compose --project-name clubadmin cp zitadel:/zitadel/bootstrap/admin.pat "$RUNNER_TEMP/admin.pat"
          ZITADEL_PAT="$(cat "$RUNNER_TEMP/admin.pat")" pnpm --filter @clubadmin/web test:e2e

      # The production build (ADR 0027): strict CSP and Trusted Types, the
      # initial-JavaScript budget and Lighthouse. Signed-in pages are reached
      # with a short-lived test session (the API keeps DEV_AUTH; the web app
      # has none in production).
      - name: Production build of the web app (replaces next dev)
        run: |
          set -a; . ./.env.local; set +a
          pkill -f "next dev" || true
          cd apps/web
          NODE_ENV=production DEV_AUTH=false pnpm build
          (NODE_ENV=production DEV_AUTH=false nohup pnpm exec next start --port 3000 > "$RUNNER_TEMP/web-prod.log" 2>&1 &)
          timeout 60 sh -c "until curl -sf -o /dev/null http://127.0.0.1:3000/login; do sleep 1; done"

      - name: End-to-end checks of the production build
        run: |
          set -a; . ./.env.local; set +a
          E2E_PRODUCTION=1 pnpm --filter @clubadmin/web test:e2e

      - name: Initial JavaScript budget (150 KB compressed)
        working-directory: apps/web
        run: |
          set -a; . ../../.env.local; set +a
          export NODE_EXTRA_CA_CERTS="$PWD/../../.local/caddy-root.crt"
          pnpm bundle:check https://clubadmin.localhost "$(node scripts/test-session.ts 0199a000-0000-7000-8000-000000000005)" \
            / /login /me /clubs/0199a000-0000-7000-8001-000000000002 \
            /clubs/0199a000-0000-7000-8001-000000000002/groups /groups/0199a000-0000-7000-8002-000000000007 \
            "/people/0199a000-0000-7000-8000-000000000005?clubId=0199a000-0000-7000-8001-000000000002"

      - name: Lighthouse CI (LCP, TBT, CLS, script size, accessibility)
        working-directory: apps/web
        run: |
          set -a; . ../../.env.local; set +a
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" pnpm lighthouse

      - name: Playwright and Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/.lighthouseci/
          retention-days: 7

      - name: Doctor
        if: always()
        run: pnpm dev:doctor || true

      - name: Service and app logs
        if: failure()
        run: |
          docker compose --project-name clubadmin logs --no-color --tail 300
          tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/web-prod.log" || true

  # The mobile app (P0.10, ADR 0028): a release build of the development
  # variant (JavaScript bundled, persona picker included, Caddy's CA trusted)
  # on an Android emulator against the local services, with the Maestro
  # flows and the cold-start measurement. iOS: workflow mobile-ios.yml (manual).
  mobile:
    name: Mobile app (Android build, Maestro)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Start services and seed the demo scenario
        run: |
          pnpm dev:services
          pnpm db:reset

      - name: Start the API (DEV_AUTH on, as in development)
        run: |
          echo "127.0.0.1 clubadmin.localhost auth.clubadmin.localhost api.clubadmin.localhost mail.clubadmin.localhost" | sudo tee -a /etc/hosts
          set -a; . ./.env.local; set +a
          pnpm --filter @clubadmin/api build
          (cd apps/api && nohup node --enable-source-maps --import ./dist/instrumentation.js ./dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          timeout 120 sh -c "until curl -sf -o /dev/null http://127.0.0.1:4000/health/ready; do sleep 2; done"

      - name: Build the Android app (development variant, release build)
        working-directory: apps/mobile
        run: |
          # Only the settings the app needs from .env.local (not NODE_ENV and the like).
          for key in AUTH_ISSUER AUTH_MOBILE_CLIENT_ID AUTH_PROJECT_ID SOURCE_URL; do
            echo "$key=$(grep -E "^$key=" ../../.env.local | cut -d= -f2-)" >> "$GITHUB_ENV"
            export "$key=$(grep -E "^$key=" ../../.env.local | cut -d= -f2-)"
          done
          export APP_VARIANT=development
          pnpm exec expo prebuild --platform android --no-install --clean
          cd android
          # Android lint of the libraries runs out of Metaspace on the runner and adds
          # nothing for this unpublished build; store builds keep it.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain \
            -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
          echo "APK=$PWD/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.11.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Resolve *.clubadmin.localhost for the emulator (to its loopback, forwarded by adb)
        run: |
          sudo apt-get install -y --no-install-recommends dnsmasq-base
          sudo dnsmasq --no-resolv --listen-address=127.0.0.1 --bind-interfaces \
            --address=/clubadmin.localhost/127.0.0.1 --server=1.1.1.1 --server=8.8.8.8

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro flows and cold start on the Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MAESTRO_OUT: ${{ runner.temp }}/maestro
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 127.0.0.1
          script: docker compose --project-name clubadmin cp zitadel:/zitadel/bootstrap/admin.pat "$RUNNER_TEMP/admin.pat" && ZITADEL_PAT="$(cat "$RUNNER_TEMP/admin.pat")" bash apps/mobile/scripts/ci-android-e2e.sh

      - name: Cold-start measurement
        if: always()
        run: cat "$RUNNER_TEMP/maestro/cold-start.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Maestro reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-report
          path: ${{ runner.temp }}/maestro/
          retention-days: 7

      - name: Service and API logs
        if: failure()
        run: |
          docker compose --project-name clubadmin logs --no-color --tail 200
          tail -n 200 "$RUNNER_TEMP/api.log" || true
