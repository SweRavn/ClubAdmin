name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    name: Load scenario (1,000 clubs, about 200,000 people)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm version from package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Start services (without ClamAV)
        run: pnpm dev:services

      # Budget (docs/performance.md): the full load scenario in under 10 minutes.
      - name: Seed the load scenario
        timeout-minutes: 10
        run: pnpm db:reset --scenario load
